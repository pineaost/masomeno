project_id = "masomeno"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm/es",
  "http://localhost:3000/auth/confirm/en",
  "http://localhost:3000/auth/confirm/it",
]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "MASOMENO · Confirmá tu correo / Confirm your email / Conferma la tua email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "MASOMENO · Restablecer contraseña / Reset password / Reimposta la password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enabled = false
